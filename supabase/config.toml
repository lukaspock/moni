project_id = "moeni"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true

# Edge Functions: verify_jwt is set per-function below.
# analyze-food and recompute-targets expect a user JWT (Authorization header) -> verify_jwt = true (default).
# revenuecat-webhook is authenticated via a shared-secret header instead -> verify_jwt = false.
[functions.analyze-food]
verify_jwt = true

[functions.revenuecat-webhook]
verify_jwt = false

[functions.recompute-targets]
verify_jwt = true

[functions.cleanup-label-photos]
verify_jwt = true
