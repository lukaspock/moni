version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Expo pins compatible versions; bump SDK deps with `npx expo install --fix` instead.
    ignore:
      - dependency-name: 'expo*'
      - dependency-name: 'react-native*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
    groups:
      dev-dependencies:
        dependency-type: development
