name: EAS build

# Manual iOS builds via EAS (workflow_dispatch only). Required secret: EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        default: preview
      submit:
        description: Submit to TestFlight (production only)
        type: boolean
        default: false

concurrency:
  group: eas-build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --no-audit --no-fund
      # --no-wait: the build itself runs on EAS; this job only queues it.
      - name: Build
        if: ${{ !(inputs.submit && inputs.profile == 'production') }}
        run: eas build --platform ios --profile "$PROFILE" --non-interactive --no-wait
      - name: Build + submit to TestFlight
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
