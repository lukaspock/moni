name: EAS build

# Manual iOS builds via EAS. Required secret: EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        default: preview
      submit:
        description: Submit to TestFlight (production only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build
        run: eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive --no-wait
        if: ${{ !(inputs.submit && inputs.profile == 'production') }}
      - name: Build + submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
        if: ${{ inputs.submit && inputs.profile == 'production' }}
