name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Expo doctor
        run: npx expo-doctor
        continue-on-error: true

  supabase:
    name: Supabase (functions + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno lint
        working-directory: supabase/functions
        run: deno lint
      - name: Deno typecheck
        working-directory: supabase/functions
        run: deno check */index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations + seed on a local Postgres
        run: |
          supabase db start
          supabase db reset --local
      - name: Lint schema
        run: supabase db lint --local --level warning --fail-on error
